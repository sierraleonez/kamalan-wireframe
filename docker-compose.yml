name: kamalan

services:
    mysql:
        image: mysql:8.4
        restart: unless-stopped
        ports:
            - '127.0.0.1:${DB_PORT:-3306}:3306'
        environment:
            MYSQL_DATABASE: ${DB_DATABASE}
            MYSQL_USER: ${DB_USERNAME}
            MYSQL_PASSWORD: ${DB_PASSWORD:?isi DB_PASSWORD di .env}
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?isi DB_ROOT_PASSWORD di .env}
        volumes:
            - database:/var/lib/mysql
        healthcheck:
            test: mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent
            interval: 5s
            timeout: 5s
            retries: 20
            start_period: 30s

volumes:
    database: